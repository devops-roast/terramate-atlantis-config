# Atlantis server-side repository configuration.
# This runs terramate-atlantis-config as a pre-workflow hook so that
# atlantis.yaml is dynamically generated from the Terramate stacks
# found in every pull request. Scenarios can tune the generator per pull
# request by committing a .terramate-atlantis.yaml config file.

repos:
  - id: /.*/
    pre_workflow_hooks:
      - run: terramate-atlantis-config generate --output atlantis.yaml --root .
        description: Generate atlantis.yaml from Terramate stacks
    allowed_overrides:
      - workflow
      - apply_requirements
    allow_custom_workflows: true

workflows:
  default:
    plan:
      steps:
        - init
        - plan
    apply:
      steps:
        - apply
  # The echo marker lets E2E scenarios assert that a stack's
  # atlantis_workflow global was honoured.
  production:
    plan:
      steps:
        - run: echo "e2e-workflow=production"
        - init
        - plan
    apply:
      steps:
        - apply
