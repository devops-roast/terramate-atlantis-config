# Atlantis server-side repository configuration.
# This runs `terramate generate` and then terramate-atlantis-config as
# pre-workflow hooks so that atlantis.yaml is dynamically generated from the
# Terramate stacks found in every pull request. Scenarios can tune the
# generator per pull request by committing a .terramate-atlantis.yaml config
# file.

repos:
  - id: /.*/
    pre_workflow_hooks:
      # Stacks under stacks/acme don't commit their generated Terraform code,
      # so generate it first, as such a repository would. Stacks that commit
      # their code have no generate blocks, so this changes nothing for them.
      - run: terramate generate
        description: Generate Terraform code from Terramate config
      - run: terramate-atlantis-config generate --output atlantis.yaml --root .
        description: Generate atlantis.yaml from Terramate stacks
    allowed_overrides:
      - workflow
      - apply_requirements
    allow_custom_workflows: true

workflows:
  default:
    plan:
      steps:
        - init
        - plan
    apply:
      steps:
        - apply
  # The echo marker lets E2E scenarios assert that a stack's
  # atlantis_workflow global was honored.
  production:
    plan:
      steps:
        - run: echo "e2e-workflow=production"
        - init
        - plan
    apply:
      steps:
        - apply
