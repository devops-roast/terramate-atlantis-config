---
name: release

on:
  push:
    tags:
      # Full semver tags only, so moving the major tag (v1) below does not
      # trigger another release.
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: generate token from github app
        id: github_app
        uses: getsentry/action-github-app-token@5c1e90706fe007857338ac1bfbd7a4177db2f789 # v4.0.0
        with:
          app_id: 1817613
          private_key: ${{ secrets.DEVOPS_ROAST_BOT_GH_APP_PRIVATE_KEY }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.github_app.outputs.token }}
      # Lets users pin the GitHub Action and pre-commit hook to the major
      # version (`@v1`, `rev: v1`). Pushed with the workflow's GITHUB_TOKEN,
      # which does not trigger other workflows.
      - name: Move major version tag
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${major}"
