---
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: test
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  lint:
    name: lint
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    needs: [test, lint]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -o terramate-atlantis-config-${{ matrix.goos }}-${{ matrix.goarch }} .
      - uses: actions/upload-artifact@v7
        with:
          name: terramate-atlantis-config-${{ matrix.goos }}-${{ matrix.goarch }}
          path: terramate-atlantis-config-*

  action:
    name: action (${{ matrix.os }}, ${{ matrix.install }})
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        install: [release, source]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        if: matrix.install == 'source'
        with:
          go-version-file: go.mod
          cache: false
      - name: Set output path
        run: echo "OUTPUT=${RUNNER_TEMP}/atlantis.yaml" >>"$GITHUB_ENV"

      - name: Generate
        id: generate
        uses: ./
        with:
          # "source" exercises the action's `go install` path with a branch
          # ref. Building this PR's own commit would need direct git fetches,
          # which are flaky on runners ("shallow file has changed").
          version: ${{ matrix.install == 'source' && 'main' || 'latest' }}
          root: testdata/multi
          output: ${{ env.OUTPUT }}
      - name: Assert generate outputs
        env:
          PROJECTS: ${{ steps.generate.outputs.projects }}
          VERSION: ${{ steps.generate.outputs.version }}
        run: |
          echo "installed ${VERSION}, ${PROJECTS} projects"
          test -s "$OUTPUT"
          test "$PROJECTS" = 3

      - name: Check (up to date)
        id: check
        uses: ./
        with:
          version: ${{ steps.generate.outputs.version }}
          root: testdata/multi
          output: ${{ env.OUTPUT }}
          check: "true"
      - name: Assert check outputs
        env:
          PROJECTS: ${{ steps.check.outputs.projects }}
        run: test "$PROJECTS" = 3

      - name: Make output stale
        run: echo "# stale" >>"$OUTPUT"
      - name: Check (stale)
        id: stale
        continue-on-error: true
        uses: ./
        with:
          version: ${{ steps.generate.outputs.version }}
          root: testdata/multi
          output: ${{ env.OUTPUT }}
          check: "true"
      - name: Assert stale check failed
        env:
          OUTCOME: ${{ steps.stale.outcome }}
          PROJECTS: ${{ steps.stale.outputs.projects }}
        run: |
          test "$OUTCOME" = failure
          test "$PROJECTS" = 3
