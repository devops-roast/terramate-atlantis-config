---
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: test
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install terraform and terramate
        # Same pinned versions as e2e/Dockerfile.atlantis. cmd/terramate_cli_test.go
        # runs the generated workflow commands with these binaries.
        # The terramate release is downloaded with gh and the workflow's
        # token: anonymous github.com downloads can time out (HTTP 504).
        env:
          TERRAFORM_VERSION: 1.17.1
          TERRAMATE_VERSION: 0.17.3
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          curl -fsSLO --retry 5 --retry-all-errors "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSLO --retry 5 --retry-all-errors "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
          grep " terraform_${TERRAFORM_VERSION}_linux_amd64.zip\$" "terraform_${TERRAFORM_VERSION}_SHA256SUMS" | sha256sum -c -
          gh release download "v${TERRAMATE_VERSION}" --repo terramate-io/terramate \
            --pattern "terramate_${TERRAMATE_VERSION}_linux_x86_64.tar.gz" --pattern checksums.txt
          grep " terramate_${TERRAMATE_VERSION}_linux_x86_64.tar.gz\$" checksums.txt | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          unzip -q -o "terraform_${TERRAFORM_VERSION}_linux_amd64.zip" terraform -d "$HOME/.local/bin"
          tar -xzf "terramate_${TERRAMATE_VERSION}_linux_x86_64.tar.gz" -C "$HOME/.local/bin" terramate
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/terraform" version
          "$HOME/.local/bin/terramate" version
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          REQUIRE_TERRAMATE_CLI: "1"

  lint:
    name: lint
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    needs: [test, lint]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -o terramate-atlantis-config-${{ matrix.goos }}-${{ matrix.goarch }} .
      - uses: actions/upload-artifact@v7
        with:
          name: terramate-atlantis-config-${{ matrix.goos }}-${{ matrix.goarch }}
          path: terramate-atlantis-config-*

  action:
    name: action (${{ matrix.os }}, ${{ matrix.install }})
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        install: [release, source]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        if: matrix.install == 'source'
        with:
          go-version-file: go.mod
          cache: false
      - name: Set output path
        run: echo "OUTPUT=${RUNNER_TEMP}/atlantis.yaml" >>"$GITHUB_ENV"

      - name: Generate
        id: generate
        uses: ./
        with:
          # "source" exercises the action's `go install` path with a branch
          # ref. Building this PR's own commit would need direct git fetches,
          # which are flaky on runners ("shallow file has changed").
          version: ${{ matrix.install == 'source' && 'main' || 'latest' }}
          root: testdata/multi
          output: ${{ env.OUTPUT }}
      - name: Assert generate outputs
        env:
          PROJECTS: ${{ steps.generate.outputs.projects }}
          VERSION: ${{ steps.generate.outputs.version }}
        run: |
          echo "installed ${VERSION}, ${PROJECTS} projects"
          test -s "$OUTPUT"
          test "$PROJECTS" = 3

      - name: Check (up to date)
        id: check
        uses: ./
        with:
          version: ${{ steps.generate.outputs.version }}
          root: testdata/multi
          output: ${{ env.OUTPUT }}
          check: "true"
      - name: Assert check outputs
        env:
          PROJECTS: ${{ steps.check.outputs.projects }}
        run: test "$PROJECTS" = 3

      # A multi-line `args` block must be split on newlines too (with only
      # the first line, --sort-by would have no value), and --diff in `args`
      # must not break the project count.
      - name: Check with multi-line args
        id: multiline
        uses: ./
        with:
          version: ${{ steps.generate.outputs.version }}
          root: testdata/multi
          output: ${{ env.OUTPUT }}
          check: "true"
          args: |
            --diff --sort-by
            dir
      - name: Assert multi-line args outputs
        env:
          PROJECTS: ${{ steps.multiline.outputs.projects }}
        run: test "$PROJECTS" = 3

      - name: Make output stale
        run: echo "# stale" >>"$OUTPUT"
      - name: Check (stale)
        id: stale
        continue-on-error: true
        uses: ./
        with:
          version: ${{ steps.generate.outputs.version }}
          root: testdata/multi
          output: ${{ env.OUTPUT }}
          check: "true"
      - name: Assert stale check failed
        env:
          OUTCOME: ${{ steps.stale.outcome }}
          PROJECTS: ${{ steps.stale.outputs.projects }}
        run: |
          test "$OUTCOME" = failure
          test "$PROJECTS" = 3
